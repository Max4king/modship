# Bootstrap compose for modship shared infrastructure.
# Individual minecraft servers are generated and deployed dynamically by modship
# as separate compose projects (docker compose -p <name> up -d).
#
# Usage:
#   cp .env.example .env  # fill in your keys
#   docker compose up -d

networks:
  minecraft-network:
    driver: bridge
    name: modship_minecraft-network

services:
  # mc-router routes incoming Minecraft connections by hostname to the
  # correct backend server. Routes are managed at runtime via the HTTP API.
  # https://github.com/itzg/mc-router
  router:
    image: ghcr.io/itzg/mc-router:latest
    command: "-in-docker -api :25566"
    networks:
      - minecraft-network
    environment:
      # Routes are added/removed dynamically by modship via the HTTP API.
      # Seed with static mappings here if needed:
      # MAPPING: |
      #   myserver.example.com=myserver:25565
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro,Z
    restart: unless-stopped
    ports:
      - "25565:25565"   # Minecraft traffic
      - "25566:25566"   # HTTP API (for modship)

  # modship web UI + deployment orchestrator.
  # Runs on the same host, talks to Docker socket and mc-router API.
  modship:
    build: .
    networks:
      - minecraft-network
    env_file: .env
    environment:
      MODSHIP_ROUTER_URL: http://router:25566
      MODSHIP_DOCKER_NETWORK: modship_minecraft-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deployments:/deployments
      - ./data:/data
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - router
