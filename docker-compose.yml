  create-delight:
    image: ghcr.io/itzg/minecraft-server:java17
    networks:
      minecraft-network:
        ipv4_address: 172.18.0.4
    labels:
      - lazymc.enabled=true
    tty: true
    stdin_open: true
    environment:
      EULA: "TRUE"
      MEMORY: 10G
      VERSION: "1.20.1"
      LEVEL: world
      ENABLE_COMMAND_BLOCK: "TRUE"
      SNOOPER_ENABLED: "FALSE"
      MODPACK_PLATFORM: "MODRINTH"
      MODRINTH_MODPACK: "/data/Create With Delight 2.mrpack"
      WHITELIST: |
        Ryan_3311
        AyumiKa
        MeTamTam
      MAX_TICK_TIME: -1
      MODRINTH_EXCLUDE_FILES: freecam
    # Set restart to unless-stopped so lazymc can manage it properly
    restart: always
    volumes:
      - ./create-delight2:/data

  liminal:
    image: ghcr.io/itzg/minecraft-server:java17
    networks:
      minecraft-network:
        ipv4_address: 172.18.0.5
    tty: true
    stdin_open: true
    environment:
      EULA: "TRUE"
      MEMORY: 10G
      VERSION: "1.20.1"
      LEVEL: world
      ENABLE_COMMAND_BLOCK: "TRUE"
      SNOOPER_ENABLED: "FALSE"
      CF_API_KEY: ${CF_API_KEY}
      MODPACK_PLATFORM: AUTO_CURSEFORGE
      CF_SLUG: "liminal-industries"
      CF_FILE_ID: "7397248"
      WHITELIST: |
        Ryan_3311
        AyumiKa
        MeTamTam
      MAX_TICK_TIME: -1
    # Set restart to unless-stopped so lazymc can manage it properly
    restart: always
    volumes:
      - ./liminal:/data
