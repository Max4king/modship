networks:
  minecraft-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16

services:
  router:
    image: ghcr.io/itzg/mc-router:latest
    command: "-debug -in-docker"
    networks:
      minecraft-network:
        ipv4_address: 172.18.0.2
    environment:
      # Point domains to the LazyMC proxy on the unique ports defined below
      MAPPING: |
        create-delight.max4king.com=create-delight:25565
        liminal.max4king.com=liminal:25565
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro,Z
    restart: unless-stopped
    ports:
      - "25565:25565"
